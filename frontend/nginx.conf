server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Browsers kept an old app.js for days (Last-Modified only, no Cache-Control) and drew the
    # new page with the old script: a skeleton that never loaded. no-cache means "always ask,
    # reuse only if the ETag still matches", which is cheap for a panel this small.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
    }

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
