version: '3.8'

services:
  nestnet-backend:
    build: ./backend
    container_name: nestnet-api
    network_mode: host
    privileged: true
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    environment:
      - WAN_INTERFACE=${WAN_INTERFACE:-ppp0}
      - LAN_INTERFACE=${LAN_INTERFACE:-enp5s0}
      - DRY_RUN=${DRY_RUN:-true}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
  
  nestnet-frontend:
    build: ./frontend
    container_name: nestnet-ui
    ports:
      - "${UI_PORT:-3002}:80"
    depends_on:
      - nestnet-backend
    restart: unless-stopped
